<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آزمایشگاه تشخیص طبی و تخصصی پیوند</title>
<link rel="stylesheet" href="../system/payvandlab-tokens.css">
<link rel="stylesheet" href="../system/payvandlab-components.css">
<link rel="stylesheet" href="media/payvandlab-home.css">
<script src="../system/media/vendor/react-framer-motion.js"></script>
<script src="../system/payvandlab-motion.js"></script>
<script src="../system/payvandlab-components.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { React, createRoot, AnimatePresence, MotionConfig, html } = window.Vendor;
const { useState, useEffect } = React;
const { Util, Head, Results, List, Hours, Foot, Sheet, Chat } = window.PV;

const q = new URLSearchParams(location.search);
const initial = q.get("state") || "first";
const narrow = matchMedia("(max-width: 959.98px)");

function Jobs() {
  return html`<section class="pv-sec" id="jobs" aria-labelledby="pv-jobs-h"><div class="pv-wrap">
    <h2 id="pv-jobs-h">پیش از مراجعه</h2>
    <div class="pv-jobs">
      <${List}/>
      <${Hours} id="pv-hours"/>
    </div>
  </div></section>`;
}

function Review({ state }) {
  const S = [["first", "صفحه اول (پیوندیار بسته)"], ["full", "تمام صفحه"], ["menu", "منوی گوشی باز"], ["chat", "پیوندیار باز"]];
  return html`<aside class="pv-review" aria-label="پنل بازبینی"><div class="pv-wrap">
    <h2>پنل بازبینی طرح (بخشی از سایت نیست)</h2>
    <p>هر وضعیت را در عرض ۳۶۰ (گوشی) و ۱۲۸۰ (رومیزی) ببینید. منوی گوشی فقط زیر عرض ۹۶۰ وجود دارد؛ در رومیزی همان ناوبری سرصفحه است و «منوی گوشی باز» همان صفحه اول را نشان می‌دهد.</p>
    <ul>${S.map(s => html`<li key=${s[0]}><a href=${"?state=" + s[0]} aria-current=${s[0] === state ? "true" : null}>${s[1]}</a></li>`)}</ul>
  </div></aside>`;
}

function App() {
  const [menu, setMenu] = useState(initial === "menu" && narrow.matches);
  const [chat, setChat] = useState(initial === "chat");
  useEffect(() => {
    if (initial === "full") requestAnimationFrame(() => document.getElementById("jobs").scrollIntoView({ block: "start" }));
    const onWidth = e => { if (!e.matches) setMenu(false); };
    narrow.addEventListener("change", onWidth);
    return () => narrow.removeEventListener("change", onWidth);
  }, []);
  const closeMenu = () => { setMenu(false); const b = document.getElementById("pv-menubtn"); b && b.focus({ preventScroll: true }); };
  const closeChat = () => { setChat(false); const y = document.getElementById("pv-yar"); y && y.focus({ preventScroll: true }); };
  return html`<${MotionConfig} reducedMotion="user">
    <div id="page">
      <${Util} chatOpen=${chat} onChat=${() => setChat(v => !v)}/>
      <${Head} onMenu=${() => setMenu(true)}/>
      <main>
        <${Results} h1=${true}/>
        <${Jobs}/>
      </main>
      <${Foot}/>
      <${Review} state=${initial}/>
    </div>
    <${AnimatePresence}>${menu ? html`<${Sheet} key="menu" onClose=${closeMenu}/>` : null}<//>
    <${AnimatePresence}>${chat ? html`<${Chat} key="chat" onClose=${closeChat}/>` : null}<//>
  <//>`;
}

createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
