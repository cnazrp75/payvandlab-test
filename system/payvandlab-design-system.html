<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سامانه طراحی سایت آزمایشگاه پیوند</title>
<link rel="stylesheet" href="payvandlab-tokens.css">
<link rel="stylesheet" href="payvandlab-components.css">
<script src="media/vendor/react-framer-motion.js"></script>
<script src="payvandlab-motion.js"></script>
<script src="payvandlab-components.js"></script>
<style>
.ds-top{background:var(--pv-surface);border-bottom:1px solid var(--pv-line)}
.ds-top .pv-wrap{padding-top:var(--pv-s6);padding-bottom:var(--pv-s6);display:grid;gap:var(--pv-s3)}
.ds-top img{width:152px}
.ds-top h1{margin:0;font-size:var(--pv-fs-h2);font-weight:900;line-height:var(--pv-lh-tight)}
.ds-top p{margin:0;font-size:var(--pv-fs-small);color:var(--pv-ink-2);max-width:68ch}
.ds-idea{font-size:var(--pv-fs-body)!important;color:var(--pv-ink)!important;font-weight:500}
.ds-index{display:flex;flex-wrap:wrap;gap:var(--pv-s1) var(--pv-s2);margin:var(--pv-s2) 0 0;padding:0;list-style:none}
.ds-index a{display:inline-flex;align-items:center;min-height:var(--pv-tap-min);padding:0 var(--pv-s3);border:1px solid var(--pv-line);border-radius:var(--pv-r-pill);text-decoration:none;font-size:var(--pv-fs-small);font-weight:500;color:var(--pv-ink-2);background:var(--pv-paper)}
.ds-index a:hover{border-color:var(--pv-field-line);color:var(--pv-ink)}
.ds-later{font-size:var(--pv-fs-small)!important}
.ds-sec{padding:var(--pv-s10) 0;border-bottom:1px solid var(--pv-line)}
.ds-sec>.pv-wrap>h2{margin:0;font-size:var(--pv-fs-h2);font-weight:700;line-height:var(--pv-lh-tight);display:flex;gap:var(--pv-s3);align-items:baseline}
.ds-sec>.pv-wrap>h2 span{font-size:var(--pv-fs-small);color:var(--pv-ink-3);font-weight:500}
.ds-why{margin:var(--pv-s2) 0 var(--pv-s6);font-size:var(--pv-fs-small);color:var(--pv-ink-2);max-width:72ch}
.ds-why b{color:var(--pv-ink)}
.ds-h3{margin:var(--pv-s8) 0 var(--pv-s3);font-size:var(--pv-fs-h3);font-weight:700}
.ds-sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:var(--pv-s3)}
.ds-swatch{display:grid;grid-template-columns:48px 1fr;gap:var(--pv-s3);align-items:start;padding:var(--pv-s3);background:var(--pv-surface);border:1px solid var(--pv-line);border-radius:var(--pv-r-md)}
.ds-chip{width:48px;height:48px;border-radius:var(--pv-r-sm);box-shadow:inset 0 0 0 1px rgba(29,32,39,.08)}
.ds-swatch b{display:block;font-size:var(--pv-fs-small);line-height:1.5}
.ds-swatch code{font-family:inherit;font-size:var(--pv-fs-micro);color:var(--pv-ink-3)}
.ds-swatch p{margin:var(--pv-s1) 0 0;font-size:var(--pv-fs-micro);color:var(--pv-ink-2);line-height:1.6}
.ds-table{width:100%;border-collapse:collapse;font-size:var(--pv-fs-small);background:var(--pv-surface);border:1px solid var(--pv-line);border-radius:var(--pv-r-md);overflow:hidden}
.ds-table th,.ds-table td{padding:var(--pv-s2) var(--pv-s3);text-align:start;vertical-align:middle;border-top:1px solid var(--pv-line)}
.ds-table thead th{border-top:0;font-weight:500;color:var(--pv-ink-3);font-size:var(--pv-fs-micro);background:var(--pv-paper)}
.ds-table td.ds-r{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ds-pair{display:inline-flex;align-items:center;min-height:36px;padding:0 var(--pv-s3);border-radius:var(--pv-r-sm);font-weight:700;white-space:nowrap}
.ds-ring{display:inline-block;width:56px;height:28px;border-radius:var(--pv-r-sm)}
.ds-scroll{overflow-x:auto}
.ds-type{display:grid;gap:0;background:var(--pv-surface);border:1px solid var(--pv-line);border-radius:var(--pv-r-md)}
.ds-type>div{display:grid;gap:var(--pv-s1);padding:var(--pv-s4);border-top:1px solid var(--pv-line)}
.ds-type>div:first-child{border-top:0}
.ds-meta{font-size:var(--pv-fs-micro);color:var(--pv-ink-3);line-height:1.6}
.ds-meta b{color:var(--pv-ink-2);font-weight:700}
.ds-grid2{display:grid;gap:var(--pv-s4)}
.ds-box{background:var(--pv-surface);border:1px solid var(--pv-line);border-radius:var(--pv-r-md);padding:var(--pv-s4)}
.ds-scale{display:grid;gap:var(--pv-s2)}
.ds-scale div{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:var(--pv-s3);font-size:var(--pv-fs-micro);color:var(--pv-ink-2)}
.ds-scale i{display:block;height:12px;background:var(--pv-ink-3);border-radius:2px}
.ds-radii{display:flex;flex-wrap:wrap;gap:var(--pv-s4)}
.ds-radii div{display:grid;justify-items:center;gap:var(--pv-s2);font-size:var(--pv-fs-micro);color:var(--pv-ink-2);text-align:center}
.ds-radii i{display:block;width:72px;height:56px;border:2px solid var(--pv-ink-3);background:var(--pv-paper)}
.ds-elev{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--pv-s5)}
.ds-elev div{height:84px;background:var(--pv-surface);border-radius:var(--pv-r-md);display:grid;place-items:center;text-align:center;padding:var(--pv-s2);font-size:var(--pv-fs-micro);color:var(--pv-ink-2);line-height:1.5}
.ds-stage{background:var(--pv-paper-2);border:1px solid var(--pv-line);border-radius:var(--pv-r-md);padding:var(--pv-s4);overflow:hidden}
.ds-stage.is-bleed{padding:0}
.ds-stage.is-wash{background:var(--pv-wash);border-color:var(--pv-wash-line)}
.ds-states{display:grid;gap:var(--pv-s4);grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:var(--pv-s4)}
.ds-state{display:grid;gap:var(--pv-s2);align-content:start}
.ds-state>span{font-size:var(--pv-fs-micro);color:var(--pv-ink-3);font-weight:500}
.ds-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--pv-s3)}
.ds-frames{display:grid;gap:var(--pv-s5)}
.ds-frame{display:grid;gap:var(--pv-s2);justify-items:start}
.ds-frame>span{font-size:var(--pv-fs-micro);color:var(--pv-ink-3);font-weight:500}
.ds-frame iframe{display:block;box-sizing:content-box;width:360px;max-width:calc(100% - 2px);height:640px;border:1px solid var(--pv-line);border-radius:var(--pv-r-lg);background:var(--pv-surface)}
.ds-only-wide{display:none}
.ds-only-narrow{font-size:var(--pv-fs-small);color:var(--pv-ink-2);margin:var(--pv-s3) 0 0}
.ds-chatframe{position:relative;height:500px;width:380px;max-width:100%}
.ds-chatframe .pv-chat{position:absolute;inset:0;width:auto;height:auto;min-height:0}
.ds-motion td:first-child{white-space:nowrap;font-weight:700}
.ds-end{padding:var(--pv-s8) 0 var(--pv-s12);font-size:var(--pv-fs-small);color:var(--pv-ink-2)}
@media (min-width:960px){
  .ds-only-wide{display:block}
  .ds-only-narrow{display:none}
  .ds-grid2{grid-template-columns:1fr 1fr;gap:var(--pv-s6)}
  .ds-frames{grid-template-columns:repeat(2,max-content);gap:var(--pv-s8)}
  .ds-top .pv-wrap{padding-top:var(--pv-s8);padding-bottom:var(--pv-s8)}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
const { React, createRoot, MotionConfig, html } = window.Vendor;
const { useEffect, useRef, useState } = React;
const PV = window.PV;
const M = window.PvMotion;

const fa = v => String(v).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]).replace(".", "٫");

function Spec({ marks, cls, children }) {
  const ref = useRef(null);
  useEffect(() => {
    const t = setTimeout(() => (marks || []).forEach(([sel, c, style]) => {
      const e = ref.current && ref.current.querySelector(sel);
      if (!e) return;
      if (c) c.split(" ").forEach(k => e.classList.add(k));
      if (style) Object.assign(e.style, style);
    }), 60);
    return () => clearTimeout(t);
  }, []);
  return html`<div ref=${ref} class=${cls || ""}>${children}</div>`;
}

const State = ({ label, children }) => html`<div class="ds-state">${children}<span>${label}</span></div>`;

function Sec({ id, n, title, why, children }) {
  return html`<section class="ds-sec" id=${id} aria-labelledby=${id + "-h"}><div class="pv-wrap">
    <h2 id=${id + "-h"}><span>${fa(n)}</span>${title}</h2>
    <p class="ds-why">${why}</p>
    ${children}
  </div></section>`;
}

const COLORS = [
  ["brand", [
    ["navy", "سرمه‌ای لوگو", "تنها رنگ پررنگ سایت؛ فقط ورود به جواب آزمایش، گزینه «جواب آزمایش» در منو و حلقه فوکوس، تا همیشه یعنی «جواب»."],
    ["navy-press", "سرمه‌ای فشرده", "هاور و فشار ورود؛ همان رنگ، یک پله تیره‌تر، بدون رنگ تازه."],
    ["navy-ink", "جوهر پیوند", "پیوندها و برچسب «امروز»؛ تیره‌تر از سرمه‌ای تا متن کوچک روی سطح آبی خوانا بماند."],
    ["cyan", "فیروزه‌ای لوگو", "برای متن و آیکون کم‌رنگ است (۲٫۱۴:۱)؛ فقط منبع رنگ سطح خنک است."],
    ["wash", "سطح خنک", "زمینه بخش جواب آزمایش، از فیروزه‌ای لوگو؛ جای جواب را بی پرِ سرمه‌ای بزرگ نشان می‌دهد."],
    ["wash-line", "خط سطح خنک", "مرز بخش جواب و دکمه‌های کوچک روی آن."],
    ["wash-line-2", "خط سطح خنک، هاور", "هاور دکمه‌های پزشکان و مراکز همکار؛ فقط مرز پررنگ‌تر می‌شود."]
  ]],
  ["surface", [
    ["paper", "کاغذ", "زمینه گرم صفحه، مثل کاغذ قبض؛ کنار سطح خنک، ساختار با دما دیده می‌شود نه فقط با خاکستری."],
    ["paper-2", "کاغذ ۲", "نوار تلفن و پیوندیار بالای صفحه و هاور منو؛ یک پله گرم‌تر از کاغذ."],
    ["surface", "سفید", "سرصفحه، کارت‌ها و پنل‌ها؛ بیشترین کنتراست برای متن."],
    ["hover", "هاور ردیف", "هاور ردیف‌های فهرست؛ آن‌قدر کم که فقط بگوید زیر نشانگر است."],
    ["line", "خط", "جداکننده‌های گرم کارت‌ها و ردیف‌ها."],
    ["field-line", "مرز فیلد", "مرز فیلد پیام و هاور دکمه‌های قاب‌دار؛ ۴٫۰۲:۱ روی سفید، بالای ۳:۱ مرز کنترل."],
    ["scrim", "پرده", "پشت منوی گوشی؛ صفحه دیده می‌شود ولی عقب می‌رود."]
  ]],
  ["ink", [
    ["ink", "جوهر", "متن اصلی، عنوان‌ها و دکمه تیره (پیوندیار باز، ارسال)."],
    ["ink-2", "جوهر ۲", "متن توضیح، پیوندهای منو و آیکون‌ها."],
    ["ink-3", "جوهر ۳", "برچسب‌ها و آیکون‌های کم‌اهمیت؛ کم‌رنگ‌ترین متن، هنوز بالای ۴٫۵:۱."],
    ["on-navy", "روی سرمه‌ای", "عنوان و فلش ورود."],
    ["on-navy-2", "روی سرمه‌ای ۲", "خط دوم ورود «ورود به سامانه جوابدهی آنلاین»؛ یک پله آرام‌تر از عنوان."],
    ["on-navy-tint", "دایره فلش", "زمینه دایره فلش روی ورود؛ سفید ۱۴٪."],
    ["on-ink", "روی جوهر", "متن روی دکمه تیره."]
  ]],
  ["foot", [
    ["foot", "پاورقی", "زغالی گرم، نه سرمه‌ای، تا سرمه‌ای فقط معنای «جواب» را نگه دارد."],
    ["on-foot", "روی پاورقی", "متن و پیوندهای پاورقی و حلقه فوکوس روی آن (focus-on-dark)."],
    ["on-foot-2", "روی پاورقی ۲", "عنوان ستون‌های پاورقی."],
    ["foot-line", "خط پاورقی", "جداکننده فهرست تاییدیه‌ها."]
  ]]
];
const GROUP = { brand: "رنگ‌های لوگو و سطح جواب", surface: "سطح‌ها و خط‌ها", ink: "جوهرها", foot: "پاورقی" };

function Colors() {
  const cs = getComputedStyle(document.documentElement);
  return html`${COLORS.map(([g, list]) => html`<div key=${g}>
    <h3 class="ds-h3">${GROUP[g]}</h3>
    <div class="ds-sw">${list.map(([t, name, why]) => html`<div class="ds-swatch" key=${t}>
      <i class="ds-chip" style=${{ background: "var(--pv-" + t + ")" }}></i>
      <div><b>${name}</b><code class="pv-lat">--pv-${t} ${cs.getPropertyValue("--pv-" + t).trim()}</code><p>${why}</p></div>
    </div>`)}</div>
  </div>`)}`;
}

const PAIRS = [
  ["ink", "paper", "t", "متن اصلی روی صفحه"], ["ink", "surface", "t", "متن روی کارت و سرصفحه"], ["ink", "paper-2", "t", "تلفن در نوار بالا"], ["ink", "hover", "t", "ردیف فهرست در هاور"],
  ["ink-2", "surface", "t", "توضیح ردیف، منو، ساعت"], ["ink-2", "paper", "t", "متن توضیح روی صفحه"], ["ink-2", "wash", "t", "«وارد نمی‌شوید؟»"], ["ink-2", "paper-2", "i", "آیکون تلفن"],
  ["ink-3", "surface", "t", "برچسب «نام کاربری»"], ["ink-3", "wash", "t", "«پزشک یا مرکز همکار هستید؟»"], ["ink-3", "paper-2", "t", "واژه «تلفن»"], ["ink-3", "paper", "t", "متن کمکی روی صفحه"],
  ["on-navy", "navy", "t", "عنوان ورود"], ["on-navy", "navy-press", "t", "عنوان ورود در هاور"], ["on-navy-2", "navy", "t", "خط دوم ورود"], ["on-navy-2", "navy-press", "t", "خط دوم در هاور"],
  ["navy", "wash", "t", "«جواب آزمایش» در منوی رومیزی"], ["navy", "wash-line", "t", "همان در هاور"], ["navy-ink", "wash", "t", "پیوند راهنما و «امروز»"], ["navy-ink", "surface", "t", "پیوند روی کارت"],
  ["on-foot", "foot", "t", "متن پاورقی"], ["on-foot-2", "foot", "t", "عنوان پاورقی"], ["on-ink", "ink", "t", "پیوندیار باز، ارسال"],
  ["focus", "paper", "r", "حلقه فوکوس روی صفحه"], ["focus", "surface", "r", "روی کارت"], ["focus", "wash", "r", "روی سطح جواب"], ["focus", "paper-2", "r", "روی نوار بالا"], ["focus-on-dark", "foot", "r", "روی پاورقی"],
  ["field-line", "surface", "r", "مرز فیلد پیام"],
  ["ink", "wash", "t", "عنوان صفحه روی سطح جواب"], ["navy-ink", "paper", "t", "پیوند کمکی در پاسخ باز"], ["ink-2", "paper-2", "i", "پیکان پرسش بسته"], ["on-ink", "ink", "i", "پیکان پرسش باز"], ["ink-3", "paper-2", "t", "«نمونه پیامک پذیرش»"], ["ink-3", "surface", "t", "جای خالی پیامک"], ["navy-ink", "wash", "t", "برچسب «نام کاربری» و «رمز عبور»"], ["ink", "paper", "t", "متن پاسخ باز"], ["navy-ink", "wash", "i", "تیک پایان گام‌ها"]
];
const rgbOf = v => { const c = document.createElement("i"); c.style.color = v; document.body.appendChild(c); const m = getComputedStyle(c).color.match(/[\d.]+/g).map(Number); c.remove(); return m; };
const lum = ([r, g, b]) => [r, g, b].map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }).reduce((a, v, i) => a + v * [0.2126, 0.7152, 0.0722][i], 0);
const ratio = (f, b) => { const x = lum(rgbOf(f)), y = lum(rgbOf(b)); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };

function Contrast() {
  const [rows, setRows] = useState([]);
  useEffect(() => { setRows(PAIRS.map(([f, b, k, use]) => ({ f, b, k, use, r: ratio("var(--pv-" + f + ")", "var(--pv-" + b + ")") }))); }, []);
  const need = k => k === "t" ? 4.5 : 3;
  const kind = { t: "متن", i: "آیکون", r: "مرز یا حلقه" };
  return html`<div class="ds-scroll"><table class="ds-table">
    <thead><tr><th scope="col">نمونه</th><th scope="col">جفت</th><th scope="col">کجا</th><th scope="col">نسبت</th><th scope="col">حد</th></tr></thead>
    <tbody>${rows.map(p => html`<tr key=${p.f + p.b + p.use}>
      <td>${p.k === "t" ? html`<span class="ds-pair" style=${{ color: "var(--pv-" + p.f + ")", background: "var(--pv-" + p.b + ")" }}>آزمایش ۱۲</span>` : html`<span class="ds-ring" style=${{ background: "var(--pv-" + p.b + ")", boxShadow: "inset 0 0 0 3px var(--pv-" + p.f + ")" }}></span>`}</td>
      <td class="pv-lat" style=${{ textAlign: "end", fontSize: "var(--pv-fs-micro)" }}>${p.f} / ${p.b}</td>
      <td>${p.use}</td>
      <td class="ds-r">${fa(p.r.toFixed(2))}:۱</td>
      <td>${kind[p.k]} ${fa(need(p.k))}:۱، قبول</td>
    </tr>`)}</tbody>
  </table></div>`;
}

const TYPE = [
  ["entry", "۲۶ / ۳۴", "۹۰۰", "۱٫۳", "عنوان ورود؛ تنها عنوان سیاه‌وزن سایت، چون مهم‌ترین چیز است.", html`<span style=${{ fontSize: "var(--pv-fs-entry)", fontWeight: 900, lineHeight: 1.3 }}>جواب آزمایش</span>`],
  ["entry-compact", "۲۱", "۹۰۰", "۱٫۳", "ورود کوچک در منوی گوشی؛ کوچک‌تر ولی هنوز سنگین‌ترین در منو.", html`<span style=${{ fontSize: "var(--pv-fs-entry-compact)", fontWeight: 900, lineHeight: 1.3 }}>جواب آزمایش</span>`],
  ["h2", "۲۱ / ۲۴", "۷۰۰", "۱٫۴", "عنوان بخش؛ کوچک‌تر از ورود تا با آن رقابت نکند.", html`<span style=${{ fontSize: "var(--pv-fs-h2)", fontWeight: 700, lineHeight: 1.4 }}>پیش از مراجعه</span>`],
  ["h3", "۱۸", "۷۰۰", "۱٫۵", "عنوان ردیف و کارت.", html`<span style=${{ fontSize: "var(--pv-fs-h3)", fontWeight: 700, lineHeight: 1.5 }}>درخواست نمونه‌گیری در منزل</span>`],
  ["body", "۱۷", "۴۰۰ / ۷۰۰", "۱٫۷۵", "متن خواندنی؛ برای خوانندگان مسن یک پله بزرگ‌تر از ۱۶، و ارتفاع خط ۱٫۷۵ چون فارسی نقطه و دندانه بالا و پایین دارد.", html`<span style=${{ fontSize: "var(--pv-fs-body)" }}>نسخه را با فرمت jpg بفرستید تا کارشناسان پذیرش با شما تماس بگیرند.</span>`],
  ["small", "۱۵", "۵۰۰ / ۷۰۰", "۱٫۶", "منو، پیوندها، توضیح کوتاه.", html`<span style=${{ fontSize: "var(--pv-fs-small)" }}>روزهای تعطیل رسمی، آزمایشگاه تعطیل است.</span>`],
  ["micro", "۱۴", "۵۰۰ / ۷۰۰", "۱٫۵", "کمترین اندازه سایت: برچسب‌ها و «امروز». هیچ متنی کوچک‌تر نیست.", html`<span style=${{ fontSize: "var(--pv-fs-micro)", color: "var(--pv-ink-3)" }}>پزشک یا مرکز همکار هستید؟</span>`]
];

function Type() {
  return html`<div class="ds-type">${TYPE.map(([t, px, w, lh, why, sample]) => html`<div key=${t}>
    ${sample}

            <${State} label="ردیف بی‌پیوند: عنوان و واقعیت، با کنترل اختیاری در انتها"><${PV.List} rows=${[{ title: "درخواست جواب در گفتگوی سایت", text: "درخواست جواب را در پیوندیار، بخش گفتگوی سایت، با کارشناسان آزمایشگاه در میان بگذارید.", action: html`<${PV.Yar} open=${false}/>` }, { title: "ارسال جواب با پیک آزمایشگاه", text: "اگر می‌خواهید جواب با پیک موتوری برسد، هنگام پذیرش فرم آن را پر کنید و به همکاران آزمایشگاه بدهید." }]}/><//>
          </div>
          <div class="ds-box"><p class="ds-meta" style=${{ margin: 0 }}>ردیف اول: حالت عادی. دوم: هاور (سطح <span class="pv-lat">hover</span>، دایره فلش). سوم: فوکوس، حلقه داخل ردیف تا بریده نشود. فشار: مقیاس ۰٫۹۹. ارتفاع ۷۲ در گوشی و ۸۸ در رومیزی؛ متن بلند می‌شکند و ردیف بلندتر می‌شود.</p></div>
        </div>
      <//>
      <${Sec} id="hours" n=${9} title="جدول ساعت کار" why="«وقتی می‌روم باز است؟» دو ردیف از ساعت‌های خود آزمایشگاه؛ ردیف امروز پررنگ با برچسب «امروز» از تاریخ دستگاه. جمعه برچسبی ندارد چون منبع ساعتی برایش نگفته است.">
        <div class="ds-grid2">
          <${State} label="امروز: شنبه تا چهارشنبه"><${PV.Hours} today=${0}/><//>
          <${State} label="جمعه: بدون برچسب"><${PV.Hours} today=${-1}/><//>
          <${State} label="ردیف‌های دیگر و بی نشانی: ساعت تحویل حضوری جواب"><${PV.Hours} title="ساعت تحویل حضوری جواب" rows=${PV.PICKUP} plain=${true} today=${0}/><//>
        </div>
      <//>
      <${Sec} id="footer" n=${10} title="پاورقی" why="اعتماد برای یک خدمت پزشکی: نشانی با کدپستی، تلفن، ایمیل و تاییدیه‌های آزمایشگاه به‌صورت متن. زغالی گرم، نه سرمه‌ای.">
        <${Spec} cls="ds-stage is-bleed" marks=${[[".pv-contact a:first-child", "is-focus"], [".pv-contact a:last-child", "is-hover"]]}><${PV.Foot}/><//>
        <p class="ds-meta" style=${{ margin: "12px 0 0" }}>تلفن با حلقه فوکوس کرم، ایمیل در هاور (زیرخط).</p>
      <//>
      <${Sec} id="yar" n=${11} title="پیوندیار" why="سوال راهی برای پرسیدن می‌خواهد، اما گفتگو هرگز روی یک کار نمی‌نشیند (INV-5): دکمه قرصی با واژه در نوار بالا، نه حباب شناور؛ هرگز خودش باز نمی‌شود. گوشی: برگه از پایین با بیشینه ۴۲۰ پیکسل تا ورود دیده بماند. رومیزی: پنل ۳۸۰ در ۵۰۰ کنار دکمه.">
        <div class="ds-states">
          <${State} label="بسته"><div class="ds-row"><${PV.Yar} open=${false}/></div><//>
          <${State} label="هاور: مرز پررنگ‌تر"><${Spec} cls="ds-row" marks=${[[".pv-yar", "is-hover"]]}><${PV.Yar} open=${false}/><//><//>
          <${State} label="فوکوس"><${Spec} cls="ds-row" marks=${[[".pv-yar", "is-focus"]]}><${PV.Yar} open=${false}/><//><//>
          <${State} label="باز: پر تیره، «بستن پیوندیار»"><div class="ds-row"><${PV.Yar} open=${true}/></div><//>
        </div>
        <h3 class="ds-h3">پنل باز</h3>
        <div class="ds-frames">
          <div class="ds-frame"><span>گوشی: برگه از پایین، ورود بالای آن دیده می‌ماند</span><iframe src="../home/home.html?state=chat" title="پیوندیار باز در گوشی"></iframe></div>
          <div class="ds-frame ds-only-wide"><span>رومیزی: پنل کنار دکمه، فیلد پیام با برچسب «پیام شما»</span><${Spec} cls="ds-chatframe" marks=${[[".pv-chat-form input", "is-focus"]]}><${PV.Chat} onClose=${() => {}}/><//></div>
        </div>
      <//>
      <${Sec} id="steps" n=${12} title="گام‌های شماره‌دار" why="«حالا چه کنم؟» کاری که چند قدم پشت سر هم دارد: دایره شماره با رقم فارسی روی خط نقطه‌چین که قدم‌ها را به هم وصل می‌کند، هر گام یک خط؛ خط به نتیجه می‌رسد، تیک سرمه‌ای تیره روی سطح خنک، چون نتیجه همان جواب است. بی کارت و بی آیکون تا گام‌ها خوانده شوند نه تزئین. حرکت ندارد، چون چیزی در آن تغییر نمی‌کند. منبع ۲۱st.dev ‏26902 (ریل و گره‌های شماره‌دار)، رنگ و اندازه از توکن‌ها.">
        <div class="ds-grid2">
          <${PV.Steps} label="نمونه" items=${["دکمه «جواب آزمایش» را بزنید.", "زبانه «مراجعین آزمایشگاه» را بزنید.", "نام کاربری و رمز عبور را بنویسید."]} end=${{ title: "فایل PDF جواب نهایی و تاییدشده است", text: "مهر و امضای دیجیتال مسئول فنی آزمایشگاه روی آن ثبت شده است." }}/>
          <div class="ds-box"><p class="ds-meta" style=${{ margin: 0 }}>دایره ۳۶ پیکسل، مرز <span class="pv-lat">wash-line-2</span>، رقم ۱۵ پیکسل ۷۰۰ جوهر. متن گام ۱۷ پیکسل. خط نقطه‌چین ۲ پیکسل از زیر هر دایره تا دایره بعد. پایان: دایره روی <span class="pv-lat">wash</span> با تیک <span class="pv-lat">navy-ink</span> (۱۱٫۱۲:۱). فهرست واقعی <span class="pv-lat">ol</span> است؛ رقم دیدنی برای صفحه‌خوان پنهان است تا دو بار خوانده نشود. متن بلند می‌شکند و دایره بالای خط اول می‌ماند.</p></div>
        </div>
      <//>
      <${Sec} id="faq" n=${13} title="پرسش و پاسخ" why="«چرا کار نکرد؟» هر مشکل یک پرسش کوتاه با پاسخش؛ بسته تا فهرست مشکل‌ها یک‌جا دیده شود، فقط یکی باز. دکمه با پرسش به‌عنوان برچسب، Enter و Space باز و بسته می‌کنند، پیکان بالا و پایین و Home و End بین پرسش‌ها می‌روند. باز: دایره پیکان تیره مثل پیوندیار باز. منبع ۲۱st.dev ‏23530 (فنرها، اندازه‌گیری ارتفاع، صفحه‌کلید)، رنگ و اندازه از توکن‌ها.">
        <div class="ds-grid2">
          <${State} label="اول: هاور؛ دوم: فوکوس؛ سوم: باز"><${Spec} marks=${[["#pv-faq-h-a", "is-hover"], ["#pv-faq-h-b", "is-focus"]]}><${FaqDemo}/><//><//>
          <div class="ds-box"><p class="ds-meta" style=${{ margin: 0 }}>پرسش ۱۸ پیکسل ۷۰۰، ردیف ۶۴ پیکسل در گوشی و ۷۲ در رومیزی. پاسخ روی کاغذ گرم با متن ۱۷ پیکسل. باز شدن: ارتفاع جعبه با فنر <span class="pv-lat">disclose</span>، پیکان با <span class="pv-lat">chevron</span>، متن با <span class="pv-lat">dissolveIn</span>؛ پاسخ قبلی هم‌زمان جمع می‌شود. فشار: مقیاس ۰٫۹۹. با «کاهش حرکت» همه بی‌درنگ.</p></div>
        </div>
      <//>
      <${Sec} id="sms" n=${14} title="نمونه پیامک پذیرش" why="«شماره‌ها کجاست؟» همان متن پیامک آزمایشگاه با جای خالی، هرگز عددی شبیه واقعی؛ کنار هر شماره برچسب فیلدی که در صفحه ورود باید آن را نوشت. حباب پیام همان حباب پیوندیار (۲۱st.dev ‏24691)، روی زمینه گرم مثل صفحه پیام‌های گوشی. حرکت ندارد.">
        <div class="ds-grid2"><div class="pv-card"><${PV.Sms}/></div><div class="ds-box"><p class="ds-meta" style=${{ margin: 0 }}>عنوان کوچک <span class="pv-lat">ink-3</span> روی <span class="pv-lat">paper-2</span> (۵٫۲۶:۱). برچسب‌ها همان شکل «امروز» (<span class="pv-lat">.pv-tag</span>). جای خالی با <span class="pv-lat">ink-3</span> و برچسب صفحه‌خوان «شماره پذیرش».</p></div></div>
      <//>
    </main>
    <footer class="ds-end"><div class="pv-wrap">منبع: <span class="pv-lat">payvandlab-tokens.css</span>، <span class="pv-lat">payvandlab-components.css</span>، <span class="pv-lat">payvandlab-components.js</span>، <span class="pv-lat">payvandlab-motion.js</span>؛ صفحه اصلی از همین پرونده‌ها ساخته می‌شود.</div></footer>
  <//>`;
}

createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
